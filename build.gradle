plugins {
	id("dev.kikugie.loom-back-compat")
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName.set("quartermaster+" + (property("minecraft_version") as String))
}
repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven { name = "LadySnake (Enchancement)"; url = "https://maven.ladysnake.org/releases" };
	maven { name = "TerraformersMC (Mod Menu)"; url = "https://maven.terraformersmc.com/releases" };
	maven { name = "UpCraft (DataSync)"; url = "https://maven.uuid.gg/releases" };

}

loom {
	splitEnvironmentSourceSets()

	mods {
		"quartermaster" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "quartermaster"
	}
}


stonecutter {
	// i made some of this codebase before i realized replacements existed so there's a little bit of inconsistency around

	replacements.string(stonecutter.current.parsed >= '26.1') {
		replace 'graphics.drawString(', 'graphics.text('
		replace 'GuiGraphics', 'GuiGraphicsExtractor'
		replace 'ClientTickEvents.END_WORLD_TICK', 'ClientTickEvents.END_LEVEL_TICK'
	}
	replacements.string(stonecutter.current.parsed >= '26.3') {
		replace 'poseStack.mulPose', 'poseStack.rotate'
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:" + property("minecraft_version") as String

	loomx.applyMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:" + property("loader_version") as String

	modImplementation "net.fabricmc.fabric-api:fabric-api:" + property("fabric_api_version") as String
}

processResources {
	def version = project.version
	inputs.property "version", version

	def minecraft = stonecutter.current.version
	def injection = "$minecraft" as String
	injection = "~" + injection

	filesMatching("fabric.mod.json") {
		expand "version": version,
		 	"minecraft_version": injection
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
